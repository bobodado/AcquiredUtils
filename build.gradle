plugins {
    id 'fabric-loom' version '1.8.12'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.acquiredutils'

base {
    archivesName = 'acquiredutils'
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

// Exclude the broken module from ALL dependencies (including transitive from YACL/ModMenu)
configurations.all {
    exclude group: 'net.fabricmc.fabric-api', module: 'fabric-content-registries-v0'
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"

    modImplementation "dev.isxander:yet-another-config-lib:3.6.1+1.21-fabric"
    modImplementation "com.terraformersmc:modmenu:11.0.3"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}
